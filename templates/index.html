<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bharatanatyam Mudras</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Serif+Devanagari:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #0a0a0c;
            --card-bg: rgba(18, 18, 22, 0.55);
            --card-border: rgba(255, 255, 255, 0.08);
            --text: #f3f1ee;
            --text-muted: rgba(243, 241, 238, 0.62);
            --text-faint: rgba(243, 241, 238, 0.4);
            --accent: #e8a87c;
            --accent-glow: rgba(232, 168, 124, 0.45);
            --tag-bg: rgba(255, 255, 255, 0.08);
            --danger: rgba(243, 241, 238, 0.35);
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            position: relative;
        }

        .stage {
            position: fixed;
            inset: 0;
            overflow: hidden;
        }

        .stage img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .stage::after {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse at top left, rgba(0,0,0,0.55) 0%, transparent 45%),
                radial-gradient(ellipse at bottom left, rgba(0,0,0,0.65) 0%, transparent 50%),
                linear-gradient(to bottom, rgba(0,0,0,0.25) 0%, transparent 30%, transparent 70%, rgba(0,0,0,0.45) 100%);
            pointer-events: none;
        }

        .top-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 32px 40px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 10;
        }

        .brand h1 {
            font-family: 'Inter', sans-serif;
            font-size: 22px;
            font-weight: 500;
            letter-spacing: -0.015em;
            line-height: 1.15;
            color: var(--text);
        }

        .brand .devanagari {
            font-family: 'Noto Serif Devanagari', serif;
            font-size: 14px;
            font-weight: 400;
            color: var(--text-muted);
            margin-top: 4px;
            letter-spacing: 0.02em;
        }

        .icon-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            color: var(--text);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s ease, transform 0.2s ease, box-shadow 0.25s ease, color 0.2s ease;
            position: relative;
        }

        .icon-btn:hover { background: rgba(255,255,255,0.14); transform: scale(1.05); }
        .icon-btn:active { transform: scale(0.95); }

        .icon-btn[data-state="on"] {
            color: var(--accent);
            background: rgba(232, 168, 124, 0.14);
            border-color: rgba(232, 168, 124, 0.4);
            box-shadow: 0 0 0 4px rgba(232,168,124,0.08), 0 0 16px var(--accent-glow);
        }

        .icon-btn .icon-off { display: none; }
        .icon-btn[data-state="off"] .icon-on { display: none; }
        .icon-btn[data-state="off"] .icon-off { display: block; }

        .speak-pulse {
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            border: 1.5px solid var(--accent);
            opacity: 0;
            pointer-events: none;
        }

        .icon-btn[data-speaking="true"] .speak-pulse {
            animation: pulse 1.2s ease-out infinite;
        }

        @keyframes pulse {
            0%   { opacity: 0.7; transform: scale(0.9); }
            100% { opacity: 0;   transform: scale(1.6); }
        }

        .mudra-card {
            position: absolute;
            bottom: 40px;
            left: 40px;
            width: 360px;
            max-width: calc(100vw - 80px);
            background: var(--card-bg);
            backdrop-filter: blur(32px) saturate(160%);
            -webkit-backdrop-filter: blur(32px) saturate(160%);
            border: 1px solid var(--card-border);
            border-radius: 22px;
            padding: 26px;
            z-index: 10;
            box-shadow:
                0 24px 60px -12px rgba(0,0,0,0.6),
                inset 0 1px 0 rgba(255,255,255,0.05);
            animation: cardEnter 0.7s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes cardEnter {
            from { opacity: 0; transform: translateY(24px) scale(0.98); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        .tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--text-muted);
            background: var(--tag-bg);
            padding: 5px 10px 5px 8px;
            border-radius: 100px;
            margin-bottom: 16px;
            border: 1px solid rgba(255,255,255,0.06);
            transition: color 0.3s ease, border-color 0.3s ease;
        }

        .tag::before {
            content: "";
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 8px var(--accent);
            animation: blink 1.6s ease-in-out infinite;
        }

        .mudra-card.idle .tag::before { animation: none; background: var(--text-faint); box-shadow: none; }
        .mudra-card.idle .tag { color: var(--text-faint); }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50%      { opacity: 0.35; }
        }

        .mudra-card h2 {
            font-family: 'Playfair Display', serif;
            font-size: 46px;
            font-weight: 600;
            line-height: 1.05;
            letter-spacing: -0.02em;
            color: var(--text);
        }

        .mudra-card .devanagari {
            font-family: 'Noto Serif Devanagari', serif;
            font-size: 18px;
            font-weight: 400;
            color: var(--text-muted);
            margin-top: 6px;
        }

        .mudra-card .emoji {
            font-size: 36px;
            line-height: 1;
            display: inline-block;
            margin-top: 16px;
            filter: drop-shadow(0 4px 12px rgba(0,0,0,0.3));
        }

        .mudra-card p {
            margin-top: 12px;
            font-size: 13.5px;
            line-height: 1.55;
            color: var(--text-muted);
            font-weight: 400;
        }

        .fade-content {
            animation: fadeContent 0.45s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes fadeContent {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .toast {
            position: absolute;
            top: 90px;
            right: 40px;
            background: rgba(18, 18, 22, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 12.5px;
            color: var(--text-muted);
            z-index: 11;
            opacity: 0;
            transform: translateY(-8px);
            transition: opacity 0.3s ease, transform 0.3s ease;
            pointer-events: none;
            max-width: 260px;
            line-height: 1.4;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        .mudra-pop {
            position: absolute;
            top: 96px;
            left: 50%;
            transform: translate(-50%, -14px);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(18, 18, 22, 0.78);
            backdrop-filter: blur(28px) saturate(160%);
            -webkit-backdrop-filter: blur(28px) saturate(160%);
            border: 1px solid rgba(232, 168, 124, 0.32);
            padding: 10px 18px 10px 14px;
            border-radius: 100px;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.01em;
            color: var(--text);
            z-index: 12;
            opacity: 0;
            pointer-events: none;
            box-shadow:
                0 12px 30px -8px rgba(0,0,0,0.55),
                0 0 0 4px rgba(232, 168, 124, 0.06);
            transition: opacity 0.32s cubic-bezier(0.4, 0, 0.2, 1),
                        transform 0.32s cubic-bezier(0.16, 1, 0.3, 1);
            white-space: nowrap;
        }

        .mudra-pop::before {
            content: "";
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 10px var(--accent);
            flex-shrink: 0;
        }

        .mudra-pop.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        @media (max-width: 720px) {
            .top-bar { padding: 20px; }
            .mudra-card {
                left: 16px;
                right: 16px;
                bottom: 16px;
                width: auto;
                padding: 20px;
            }
            .mudra-card h2 { font-size: 36px; }
            .brand h1 { font-size: 18px; }
            .toast { right: 16px; top: 76px; }
            .mudra-pop { top: 70px; font-size: 13px; padding: 8px 14px 8px 12px; }
        }
    </style>
</head>
<body>
    <main class="stage">
        <img src="{{ url_for('video_feed') }}" alt="Live mudra detection feed">

        <header class="top-bar">
            <div class="brand">
                <h1>bharatanatyam mudras</h1>
                <div class="devanagari">भरतनाट्यम् मुद्रा</div>
            </div>
            <button class="icon-btn" id="speakerBtn" data-state="off" aria-label="Enable speech announcements" title="Click to hear each detected mudra read aloud">
                <span class="speak-pulse" aria-hidden="true"></span>
                <svg class="icon-on" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                    <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
                </svg>
                <svg class="icon-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                    <line x1="23" y1="9" x2="17" y2="15"></line>
                    <line x1="17" y1="9" x2="23" y2="15"></line>
                </svg>
            </button>
        </header>

        <div class="toast" id="toast" role="status" aria-live="polite"></div>
        <div class="mudra-pop" id="mudraPop" role="status" aria-live="polite"></div>

        <article class="mudra-card idle" id="mudraCard">
            <span class="tag" id="tagLabel">waiting for mudra</span>
            <div class="fade-content" id="mudraContent">
                <h2 id="mudraName">—</h2>
                <div class="devanagari" id="mudraDevanagari">मुद्रा प्रतीक्षा में</div>
                <span class="emoji" id="mudraEmoji">🪔</span>
                <p id="mudraDesc">Show a hand gesture to the camera. The detected mudra will appear here.</p>
            </div>
        </article>
    </main>

    <script>
        const card        = document.getElementById('mudraCard');
        const content     = document.getElementById('mudraContent');
        const $name       = document.getElementById('mudraName');
        const $dev        = document.getElementById('mudraDevanagari');
        const $emoji      = document.getElementById('mudraEmoji');
        const $desc       = document.getElementById('mudraDesc');
        const $tag        = document.getElementById('tagLabel');
        const $speakerBtn = document.getElementById('speakerBtn');
        const $toast      = document.getElementById('toast');
        const $pop        = document.getElementById('mudraPop');

        const POLL_MS     = 500;
        const STABILITY_MS = 800;
        const STORAGE_KEY = 'mudra.speakerEnabled';

        let lastShown      = null;
        let lastSpoken     = null;
        let pendingName    = null;
        let pendingSince   = 0;
        let speakerEnabled = localStorage.getItem(STORAGE_KEY) === 'true';
        let toastTimer     = null;
        let popTimer       = null;
        let indianVoice    = null;

        const FEMALE_INDIAN_NAMES = [
            'heera', 'veena', 'shruti', 'priya', 'kala', 'lekha', 'aditi',
            'isha', 'kalpana', 'neerja', 'raveena', 'aarohi', 'swara'
        ];
        const FEMALE_HINTS = ['female', 'woman', 'zira', 'aria', 'jenny', 'samantha'];

        function pickIndianFemaleVoice() {
            const voices = window.speechSynthesis.getVoices();
            if (!voices.length) return null;

            const score = (v) => {
                const name = v.name.toLowerCase();
                const lang = (v.lang || '').toLowerCase();
                let s = 0;
                if (lang === 'en-in')           s += 50;
                else if (lang.startsWith('hi')) s += 35;
                else if (lang.startsWith('en')) s += 5;
                if (FEMALE_INDIAN_NAMES.some(n => name.includes(n))) s += 40;
                if (FEMALE_HINTS.some(n => name.includes(n)))        s += 10;
                if (name.includes('ravi') || name.includes('male'))  s -= 30;
                return s;
            };

            return voices.slice().sort((a, b) => score(b) - score(a))[0];
        }

        function loadVoice() {
            indianVoice = pickIndianFemaleVoice();
        }

        loadVoice();
        if ('onvoiceschanged' in window.speechSynthesis) {
            window.speechSynthesis.addEventListener('voiceschanged', loadVoice);
        }

        function setSpeakerState(enabled, announce = true) {
            speakerEnabled = enabled;
            localStorage.setItem(STORAGE_KEY, String(enabled));
            $speakerBtn.dataset.state = enabled ? 'on' : 'off';
            $speakerBtn.setAttribute('aria-label', enabled ? 'Mute mudra announcements' : 'Enable mudra announcements');
            $speakerBtn.setAttribute('title', enabled ? 'Speech announcements on — click to mute' : 'Click to hear each detected mudra read aloud');
            if (!enabled) {
                window.speechSynthesis.cancel();
                $speakerBtn.dataset.speaking = 'false';
            }
            if (announce) showToast(enabled ? 'Speech on — mudras will be announced' : 'Speech muted');
        }

        function showToast(msg) {
            $toast.textContent = msg;
            $toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => $toast.classList.remove('show'), 2200);
        }

        function showMudraPop(name) {
            $pop.textContent = name;
            $pop.classList.remove('show');
            void $pop.offsetWidth;
            $pop.classList.add('show');
            clearTimeout(popTimer);
            popTimer = setTimeout(() => $pop.classList.remove('show'), 1800);
        }

        function speak(text) {
            if (!speakerEnabled) return;
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            if (!indianVoice) loadVoice();
            const u = new SpeechSynthesisUtterance(text);
            if (indianVoice) {
                u.voice = indianVoice;
                u.lang  = indianVoice.lang;
            } else {
                u.lang = 'en-IN';
            }
            u.rate   = 0.88;
            u.pitch  = 1.15;
            u.volume = 1;
            u.onstart = () => { $speakerBtn.dataset.speaking = 'true'; };
            u.onend   = () => { $speakerBtn.dataset.speaking = 'false'; };
            u.onerror = () => { $speakerBtn.dataset.speaking = 'false'; };
            window.speechSynthesis.speak(u);
        }

        function renderMudra(data) {
            $name.textContent  = data.display;
            $dev.textContent   = data.devanagari;
            $emoji.textContent = data.emoji;
            $desc.textContent  = data.description;
            $tag.textContent   = 'current mudra';
            card.classList.remove('idle');
            content.classList.remove('fade-content');
            void content.offsetWidth;
            content.classList.add('fade-content');
            showMudraPop(data.display);
        }

        async function poll() {
            try {
                const res = await fetch('/current_mudra', { cache: 'no-store' });
                if (!res.ok) return;
                const data = await res.json();
                if (!data.name) return;

                if (data.name !== pendingName) {
                    pendingName = data.name;
                    pendingSince = Date.now();
                    return;
                }

                if (Date.now() - pendingSince < STABILITY_MS) return;

                if (data.name !== lastShown) {
                    lastShown = data.name;
                    renderMudra(data);
                }

                if (data.name !== lastSpoken) {
                    lastSpoken = data.name;
                    speak(data.display);
                }
            } catch (_) { /* network blip, ignore */ }
        }

        $speakerBtn.addEventListener('click', () => {
            const next = !speakerEnabled;
            setSpeakerState(next);
            if (next && lastShown) {
                const m = { display: $name.textContent };
                speak(m.display);
                lastSpoken = lastShown;
            }
        });

        setSpeakerState(speakerEnabled, false);
        setInterval(poll, POLL_MS);
        poll();
    </script>
</body>
</html>
